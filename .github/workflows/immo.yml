name: immo-radar

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 7h (heure de Paris en été)
  workflow_dispatch:
  push:
    paths:
      - annonces.csv
      - config.yml

permissions:
  contents: write

concurrency:
  group: immo-radar
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Analyse
        run: python immo/analyse.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit des résultats
        run: |
          git config user.name "immo-radar"
          git config user.email "immo-radar@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "maj données"
          git push
